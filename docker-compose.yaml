services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SportWearRootLocal1234}
      SWS_IDENTITY_PASSWORD: ${SWS_IDENTITY_PASSWORD:-SportWearIdentityLocal1234}
      SWS_STORE_PASSWORD: ${SWS_STORE_PASSWORD:-SportWearStoreLocal1234}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$SWS_STORE_PASSWORD" mysql --protocol=tcp --host=127.0.0.1
          --user=sws_store --database=sportwearshop_store --batch
          --execute="SELECT 1 FROM Brand LIMIT 1" > /dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
