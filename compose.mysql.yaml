services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.mysql}
      SWS_IDENTITY_PASSWORD: ${SWS_IDENTITY_PASSWORD:?Set SWS_IDENTITY_PASSWORD in .env.mysql}
      SWS_STORE_PASSWORD: ${SWS_STORE_PASSWORD:?Set SWS_STORE_PASSWORD in .env.mysql}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
